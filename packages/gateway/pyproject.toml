[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-voice-gateway-install"
version = "0.1.0"
description = "Gateway install logic and the pairing artefacts for the Hermes voice installer"
requires-python = ">=3.10"
# Deliberately no dependency on the installer: the installer imports this package, and a cycle
# between two distributions is unresolvable.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
