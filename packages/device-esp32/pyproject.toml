[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-voice-satellite-device-esp32"
version = "1.0.0"
description = "ESP32-S3 with reSpeaker XVF3800 for the Hermes voice installer"
requires-python = ">=3.10"
dependencies = ["hermes-voice-satellite-installer"]

[project.entry-points."hermes_installer.devices"]
esp32-xvf3800 = "hermes_device_esp32"

[tool.setuptools.packages.find]
where = ["src"]
