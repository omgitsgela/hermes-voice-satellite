# Voice-surface configuration for this project.
# Copy the keys you need into ~/.hermes/config.yaml. Contains no secrets.
#
# The plugins must ALSO be enabled by name, or discovery never sees them and their toolsets
# resolve to nothing:
#   hermes plugins enable voice_satellite
# Add your own plugins beside it if you want them on the voice surface.

plugins:
  enabled:
    - voice_satellite        # the only plugin this project requires; add your own beside it
  entries:
    voice_satellite:
      allow_tool_override: false

# The voice surface runs at FULL PARITY with every other Hermes surface, so there is deliberately no
# narrow `platform_toolsets.api_server` override here.
#
# An earlier version of this file shipped one listing six toolsets and four plugins, described as
# "deliberately narrow". That is issue #20: it documented a surface that no longer exists, and anyone
# following it would build the retired configuration. The `api_server` platform now inherits the
# default toolset list, which carries 21 toolsets in a stock install: browser, clarify,
# code_execution, computer_use, connections, cronjob, delegation, file, geolocation, image_gen,
# kanban, memory, messaging, session_search, skills, terminal, todo, tts, video, vision, web.
#
# To narrow a surface on purpose, add a `platform_toolsets.api_server` list and accept that the voice
# assistant loses those abilities.

gateway:
  api_server:
    host: 127.0.0.1        # loopback ONLY. This is a full agent surface with tool access.
    port: 8642
    # No `model_routes.voice` entry, on purpose. The voice surface follows the gateway default model
    # and its fallback chain, so the device answers on whatever the gateway answers on. The earlier
    # configuration pinned DeepSeek Flash here, which is no longer how it runs.

# Hermes' own TTS/STT, for other platforms. The voice bridge runs its own Piper and
# faster-whisper inside its own virtualenv and ignores these — but keeping the two on the same
# voice is what makes the chat surface and the satellite sound alike, so `scripts/switch-voice.py`
# writes both in one step.
tts:
  provider: piper
  piper:
    voice: en_US-hfc_male-medium
    # Multi-speaker voices ONLY, and it is a numeric id here even though the bridge stores the
    # speaker NAME from the voice's own map. Leave it out entirely for a single-speaker voice;
    # `scripts/switch-voice.py --speaker <name>` resolves one to the other.
    speaker_id:
stt:
  provider: local
