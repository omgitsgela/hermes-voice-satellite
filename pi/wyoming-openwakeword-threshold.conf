# Wake service moved off 10400 so the wake shim can listen there, where the satellite already dials
# in (its --wake-uri is tcp://127.0.0.1:10400 and stays unchanged).
#
# The threshold is unchanged in the same file on purpose: systemd takes the LAST ExecStart, so a
# separate drop-in for the port would silently cancel the threshold. Both live here.
#
# Threshold 0.35 (openWakeWord's default is 0.5) was applied by Angela's request on 2026-09-22 after
# Michael found the wake word hard to trigger.
#
# To revert: delete this file and the wake shim's, restore the satellite's --wake-uri to a direct
# wake service, then daemon-reload and restart.
# NOTE: superseded by `pi/systemd/wyoming-openwakeword.service.d-overrides.conf`, which is the copy the
# hardware docs tell you to install. Kept in step with it; `scripts/test_pi_units_consistent.py` fails if
# they disagree. Consolidating the duplicated copies is issue #45.
[Service]
ExecStart=
ExecStart=/home/wyoming1/wyoming-openwakeword/script/run --uri 'tcp://127.0.0.1:10401' --threshold 0.35 --custom-model-dir /home/wyoming1/wake-models

