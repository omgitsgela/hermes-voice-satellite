[Service]
# LOCAL PATCH (Angela, 2026-09-22): --vad added.
#
# Wyoming satellites stream microphone audio only after a wake-word detection unless VAD is on.
# Follow-up mode depends on the opposite: the bridge opens a listening window with no wake involved,
# and without this flag that window received NO audio at all. Measured on the device: zero
# AudioChunk events in 14 s with a real spoken wav playing through the device's own speaker.
#
# With --vad the satellite waits for speech and then streams it, which is what a follow-up window
# needs. The wake word still works: VAD keeps streaming while it waits for a detection and drops
# back to waiting after --vad-wake-word-timeout.
#
# A drop-in rather than an edit to the unit, so a package update cannot silently undo it.
# Revert: delete this file, `sudo systemctl daemon-reload`, `sudo systemctl restart wyoming-satellite`.
ExecStart=
ExecStart=/home/wyoming1/wyoming-satellite/script/run --name 'wyoming1' --uri 'tcp://0.0.0.0:10700' \
    --mic-command 'arecord -D plughw:CARD=seeed2micvoicec,DEV=0 -r 16000 -c 1 -f S16_LE -t raw' \
    --snd-command 'aplay -D plughw:CARD=seeed2micvoicec,DEV=0 -r 22050 -c 1 -f S16_LE -t raw' \
    --wake-uri 'tcp://127.0.0.1:10400' \
    --wake-word-name 'ok_nabu' \
    --event-uri 'tcp://127.0.0.1:10500' \
    --awake-wav /home/wyoming1/sounds/awake.wav \
    --done-wav /home/wyoming1/sounds/done.wav \
    --mic-seconds-to-mute-after-awake-wav 0.1 \
    --tts-played-command '/usr/bin/python3 /home/wyoming1/wyoming-satellite/examples/led_cmd.py idle' \
    --vad
