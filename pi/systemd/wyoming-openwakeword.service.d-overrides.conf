# /etc/systemd/system/wyoming-openwakeword.service.d/10-threshold.conf
# Wake service moved off 10400 so the wake shim can listen there, where the satellite already dials
# in (its --wake-uri is tcp://127.0.0.1:10400 and stays unchanged).
#
# The threshold is unchanged in the same file on purpose: systemd takes the LAST ExecStart, so a
# separate drop-in for the port would silently cancel the threshold. Both live here.
#
# The threshold (0.35, openWakeWord's default is 0.5) was applied on 2026-09-22 after the wake word
# proved hard to trigger at the default; it now lives in satellite.env as VS_WAKE_THRESHOLD.
#
# This drop-in REPLACES the base unit's ExecStart, and the base unit no longer sets WorkingDirectory
# (systemd does not expand variables there), so the working directory is set with a cd here, the same
# way the base unit does it.
#
# To revert: delete this file and the wake shim's, restore the satellite's --wake-uri to a direct
# wake service, then daemon-reload and restart.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'cd "$VS_OPENWAKEWORD" && exec "$VS_OPENWAKEWORD/script/run" --uri "tcp://127.0.0.1:10401" --threshold "$VS_WAKE_THRESHOLD" --custom-model-dir "$VS_WAKE_MODELS"'
